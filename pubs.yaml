workflows:
  android-workflow:
    name: ZOVIX USB Printer Android
    max_build_duration: 60

    environment:
      groups:
        - google_play
      node: 22
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build Android release APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk